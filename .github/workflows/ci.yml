name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Deterministic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

  live-smoke:
    name: Claude bridge live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for Claude OAuth token
        id: token
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not available; skipping live smoke."
          fi

      - name: Set up Bun
        if: steps.token.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install tmux
        if: steps.token.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: bun install

      - name: Install Claude Code
        if: steps.token.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Show Claude version
        if: steps.token.outputs.present == 'true'
        run: |
          which claude
          claude -v

      - name: Prepare Claude OAuth token
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude"
          chmod 700 "$HOME/.claude"
          token="$(
            node <<'NODE'
          const rawToken = (process.env.CLAUDE_CODE_OAUTH_TOKEN ?? "").trim();
          const token = rawToken
            .replace(/^CLAUDE_CODE_OAUTH_TOKEN=/, "")
            .replace(/^export CLAUDE_CODE_OAUTH_TOKEN=/, "")
            .replace(/^['"]|['"]$/g, "")
            .replace(/\s+/g, "")
            .trim();
          if (!token.startsWith("sk-ant-")) {
            throw new Error("CLAUDE_CODE_OAUTH_TOKEN must be a Claude OAuth token from `claude setup-token`");
          }
          process.stdout.write(token);
          NODE
          )"
          echo "::add-mask::$token"
          echo "Prepared Claude OAuth token (${#token} chars)"
          CLAUDE_CODE_OAUTH_TOKEN="$token" CLAUDE_CONFIG_DIR="$HOME/.claude" claude auth status

      - name: Run bridge print smoke
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          token="$(
            node <<'NODE'
          const rawToken = (process.env.CLAUDE_CODE_OAUTH_TOKEN ?? "").trim();
          const token = rawToken
            .replace(/^CLAUDE_CODE_OAUTH_TOKEN=/, "")
            .replace(/^export CLAUDE_CODE_OAUTH_TOKEN=/, "")
            .replace(/^['"]|['"]$/g, "")
            .replace(/\s+/g, "")
            .trim();
          if (!token.startsWith("sk-ant-")) {
            throw new Error("CLAUDE_CODE_OAUTH_TOKEN must be a Claude OAuth token from `claude setup-token`");
          }
          process.stdout.write(token);
          NODE
          )"
          echo "::add-mask::$token"
          export CLAUDE_CODE_OAUTH_TOKEN="$token"
          out=/tmp/claude-bridge-live-smoke.json
          if ! timeout 300 env \
            -u ANTHROPIC_API_KEY \
            -u ANTHROPIC_AUTH_TOKEN \
            -u ANTHROPIC_BASE_URL \
            -u ANTHROPIC_CUSTOM_HEADERS \
            -u ANTHROPIC_MODEL \
            TERM=xterm-256color \
            CLAUDE_CONFIG_DIR="$HOME/.claude" \
            CLAUDE_BRIDGE_PRINT_READY_TIMEOUT_MS=240000 \
            CLAUDE_BRIDGE_CLAUDE_READY_TIMEOUT_MS=240000 \
            bun ./src/cli.ts \
              --desplega-verbose \
              -p "Return exactly a JSON object with resp set to ok." \
              --model sonnet \
              --output-format json \
              --json-schema '{"type":"object","properties":{"resp":{"type":"string"}},"required":["resp"],"additionalProperties":false}' \
              > "$out"; then
            echo "bridge smoke output:"
            cat "$out" 2>/dev/null || true
            echo "active bridge tmux panes:"
            (tmux ls 2>/dev/null || true) | awk -F: '/^claude-bridge-/ {print $1}' | while read -r session; do
              echo "--- $session"
              tmux capture-pane -pt "$session" -S -120 || true
            done
            exit 1
          fi

          bun -e '
            const text = await Bun.file("/tmp/claude-bridge-live-smoke.json").text();
            const result = JSON.parse(text);
            if (result.is_error) throw new Error(result.error + (result.raw_response ? "\n" + result.raw_response : ""));
            if (result.structured_output?.resp !== "ok") {
              throw new Error("Unexpected structured_output: " + JSON.stringify(result));
            }
            console.log("live smoke structured_output:", JSON.stringify(result.structured_output));
          '

      - name: Clean up bridge tmux sessions
        if: always()
        shell: bash
        run: |
          (tmux ls 2>/dev/null || true) | awk -F: '/^claude-bridge-/ {print $1}' | xargs -r -n1 tmux kill-session -t
