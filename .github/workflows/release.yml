name: Release

on:
  push:
    branches:
      - master
    paths:
      - package.json
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-change:
    name: Detect package version change
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.check.outputs.package_name }}
      version: ${{ steps.check.outputs.version }}
      version_changed: ${{ steps.check.outputs.version_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          NEW_VERSION="$(node -p "require('./package.json').version")"
          BEFORE="${{ github.event.before }}"
          OLD_VERSION=""

          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            OLD_VERSION="$(
              git show "$BEFORE:package.json" 2>/dev/null |
                node -e '
                  let input = "";
                  process.stdin.on("data", chunk => input += chunk);
                  process.stdin.on("end", () => {
                    try {
                      process.stdout.write(JSON.parse(input).version ?? "");
                    } catch {}
                  });
                '
            )"
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Package version changed: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Package version unchanged: ${NEW_VERSION}"
          fi

  validate-package:
    name: Validate release package
    runs-on: ubuntu-latest
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Validate npm package contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require("node:fs");
          const pack = JSON.parse(fs.readFileSync("/tmp/npm-pack.json", "utf8"))[0];
          const paths = pack.files.map(file => file.path).sort();
          const forbidden = paths.filter(path =>
            path.startsWith(".github/") ||
            path.startsWith("scripts/") ||
            path.startsWith(".claude/") ||
            path === "AGENTS.md" ||
            path === "CLAUDE.md" ||
            path === "bun.lock" ||
            /^src\/test-/.test(path)
          );
          const required = [
            "LICENSE",
            "README.md",
            "package.json",
            "src/cli.ts",
            "src/args.ts",
            "src/transcript.ts",
          ];
          const missing = required.filter(path => !paths.includes(path));
          if (forbidden.length || missing.length) {
            if (forbidden.length) console.error("Forbidden package files:", forbidden.join(", "));
            if (missing.length) console.error("Missing package files:", missing.join(", "));
            process.exit(1);
          }
          console.log(`Package ${pack.name}@${pack.version} contains ${paths.length} files:`);
          for (const path of paths) console.log(`- ${path}`);
          NODE

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs:
      - detect-version-change
      - validate-package
    if: needs.detect-version-change.outputs.version_changed == 'true'
    environment: npm-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check if npm version already exists
        id: npm
        env:
          PACKAGE_NAME: ${{ needs.detect-version-change.outputs.package_name }}
          VERSION: ${{ needs.detect-version-change.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${PACKAGE_NAME}@${VERSION} is already published; skipping npm publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is required to publish @desplega.ai/claude-bridge."
            exit 1
          fi
          npm publish --access public

  create-git-tag:
    name: Create git tag
    runs-on: ubuntu-latest
    needs:
      - detect-version-change
      - publish-npm
    if: needs.detect-version-change.outputs.version_changed == 'true'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        id: tag
        env:
          VERSION: ${{ needs.detect-version-change.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::warning::Tag ${TAG} already exists; skipping tag creation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - detect-version-change
      - create-git-tag
    if: needs.detect-version-change.outputs.version_changed == 'true'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_NAME: ${{ needs.detect-version-change.outputs.package_name }}
          VERSION: ${{ needs.detect-version-change.outputs.version }}
          TAG: ${{ needs.create-git-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release ${TAG} already exists; skipping release creation."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          ## Install & Run

          \`\`\`sh
          bunx ${PACKAGE_NAME}@${VERSION} --help
          bun install -g ${PACKAGE_NAME}@${VERSION}
          npm install -g ${PACKAGE_NAME}@${VERSION}
          \`\`\`

          Claude Bridge requires Bun, tmux, and Claude Code on PATH.

          EOF
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            --verify-tag
